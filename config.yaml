# TradingDesk configuration. Every limit, threshold, model, interval and endpoint
# lives here. Secrets live in .env (see .env.example). All times are US/Eastern.

paths:
  data_dir: data
  journal_db: data/journal.db
  log_dir: logs

# --- Trading session (times are HH:MM US/Eastern) ---------------------------
sessions:
  startup: "05:30"            # health checks, Newsie/Sentiment start caching
  premarket_start: "06:00"    # Scout runs on premarket gappers, tickets may appear
  open: "09:30"               # regular session, normal settings
  new_trade_cutoff: "11:00"   # no new tickets; waiting tickets expire; unfilled entries cancelled
  wind_down: "11:30"          # Trade Manager closes anything still open (wind_down_mode: close)
  market_close: "16:00"       # used when wind_down_mode is "hold"
  wind_down_mode: close       # close | hold (hold = keep managing until stop/target/close)
  tighten_stops_after_cutoff: false   # optionally tighten stops between cutoff and wind-down
  no_entries_first_minutes: 0         # optional "no trading in first N minutes" of each session
  no_entries_last_minutes: 0          # optional "no trading in last N minutes" before cutoff

# --- Risk Officer hard limits ------------------------------------------------
# Per-session limits: premarket is stricter (thin volume, wide spreads, software-managed stops).
# Dollar limits scale with the account's CASH (read from Alpaca every
# cash_refresh_sec, like WTBot's 2% / 20% sizing). Per-trade limits use current
# cash; the daily loss limit uses the day's first cash reading, so it doesn't
# shrink when cash is tied up in an open position.
risk:
  cash_refresh_sec: 60
  cash_account_below_usd: 5000  # below this, trade like a cash account: no margin, settled cash only
                                # (each day's total buys <= start-of-day cash; sales settle T+1)
  max_daily_loss_pct: 6.0       # stop trading for the day at -6% of start-of-day cash
  max_trades_per_day: 5
  max_open_positions: 2
  premarket:
    max_risk_per_trade_pct: 1.0   # half of open: thin books, software-managed stop
    max_position_pct: 10.0
    max_spread_pct: 1.0
    min_volume: 100000          # minimum shares traded so far in the session
    min_risk_reward: 1.8         # same as open; the 2R target leaves room for a small slip
  open:
    max_risk_per_trade_pct: 2.0   # WTBot: 2% of cash risked per trade
    max_position_pct: 20.0        # WTBot: 20% of cash max per position
    max_spread_pct: 1.5
    min_volume: 250000
    min_risk_reward: 1.8

# --- Scout: wraps the WTBot 5 Pillars screener (values copied from WTBot .env) ---
scout:
  poll_interval_sec: 30
  cooldown_sec: 600             # don't re-emit the same ticker within this window
  max_movers_per_pass: 25       # only the top N % gainers get a full snapshot each pass
  universe_refresh_min: 30      # rebuild the price-filtered universe this often
  workers: 8                    # parallel snapshot/float lookups
  pillars:
    min_rvol: 2.0
    min_daily_change_pct: 10.0
    min_gap_pct: 5.0
    min_price: 1.00
    max_price: 20.00
    universe_min_price: 0.10
    max_float_shares: 20000000
    rvol_lookback_days: 30
    rvol_outlier_multiple: 3.0
    strong_momentum_pct: 15.0

# --- Manager: one breakout setup (no strategy selector) ------------------------
# Breakout level = premarket high (premarket) or high of day (open).
manager:
  entry_buffer_pct: 0.1         # entry just above the breakout level
  stop_lookback_bars: 5         # stop under the low of the last 5 one-minute bars...
  stop_buffer_pct: 0.2
  min_stop_pct: 1.0             # ...but never tighter than 1% (WTBot's premarket rule)
  max_stop_pct: 8.0             # wider stop than this = no trade
  target_r: 2.0                 # first target = entry + 2 x risk (partial profit)
  target_2_r: 3.0
  max_chase_pct: 2.0            # skip if price is already 2% past the entry
  reject_no_catalyst: true      # Newsie graded "no catalyst" -> no trade (WTBot hard gate)

# --- Trade Desk (local dashboard) --------------------------------------------
desk:
  host: 127.0.0.1               # localhost only by default
  port: 8765
  ticket_ttl_sec: 90            # ticket auto-expires after this
  max_entry_drift_pct: 1.5      # ...or immediately if price moves this far from proposed entry
  alert_sound: true
  open_browser: true            # open the dashboard in the default browser on start

# --- Broker --------------------------------------------------------------------
broker:
  name: alpaca
  dry_run: false                # true = log orders, never send them
  alpaca:
    paper: true                 # must stay true (startup refuses otherwise without ALLOW_LIVE)
    data_feed: sip

# --- Trade Manager (after approval, fully automated) ----------------------------
trade_manager:
  breakeven_at_r: 1.0           # move stop to breakeven after +1R
  partial_take_fraction: 0.5    # sell this fraction at the first target
  trail_after_partial: true
  trail_pct: 3.0
  trail_min_step_pct: 0.25      # only move the trailing stop when it improves by this much
  poll_interval_sec: 2
  entry_limit_slip_pct: 0.5     # entry limit price this % above the breakout trigger
  entry_timeout_sec: 30         # premarket entry not filled in 30s -> cancel and re-arm
  max_entry_attempts: 2
  tighten_to_breakeven: true    # used when sessions.tighten_stops_after_cutoff is on

wind_down:
  close_limit_offset_pct: 0.3   # marketable limit priced this far through the bid
  retry_interval_sec: 3
  max_limit_attempts: 5         # then fall back to a market order
  halt_retry_interval_sec: 15

# --- LLMs ----------------------------------------------------------------------
llm:
  daily_spend_cap_usd: 2.00     # when hit: Newsie/Sentiment go local-only, Skeptic auto-rejects
  spike_warn_multiple: 3.0      # warn when one call's tokens exceed this x the agent's recent average
  spike_window_calls: 20
  max_retries: 2                # transport retries only; a parsed response is never re-requested
  claude:
    newsie_model: claude-sonnet-5     # same model WTBot's catalyst classifier uses today
    skeptic_model: claude-opus-5-5
    newsie_max_tokens: 2048        # sonnet-5 thinks even at low effort; 1024 could run out before the JSON (WTBot)
    skeptic_max_tokens: 2048
    timeout_sec: 60
  local:
    base_url: http://192.168.1.151:11434/v1   # defectserver Ollama (OpenAI-compatible)
    model: qwen3:14b
    thinking: true                # 14b was only reliable on roundups with thinking on
    fallback_model: qwen3:8b
    timeout_sec: 120
  # USD per million tokens. Cache write = 5-minute cache. Local models cost 0.
  # Unknown models are costed at the most expensive entry here (conservative).
  pricing:
    claude-opus-5-5:   {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
    claude-sonnet-5:   {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
    claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_write: 0.125, cache_read: 0.01}

# --- Newsie --------------------------------------------------------------------
news:
  poll_interval_sec: 60
  lookback_hours: 24
  dedup_title_similarity: 0.90       # same story if normalized titles are this similar (or same URL)
  rubric_file: prompts/catalyst_rubric.md   # the A-F rubric (edit freely)
  types_file: prompts/catalyst_types.md     # WTBot's catalyst type guide
  max_headlines_to_grade: 5          # freshest relevant headlines sent to Claude per ticker
  watch_minutes: 90                  # keep researching a ticker this long after it was last a mover
  max_watch: 40                      # most tickers researched at once (biggest movers first)
  workers: 4                         # parallel source fetches
  local_filter:                      # qwen first pass: drop headlines that aren't about this ticker or material
    enabled: true
    thinking: false
  sources:
    yahoo:        {enabled: true}
    google_news:  {enabled: true}
    edgar:        {enabled: true, forms: ["8-K", "S-1", "S-3", "F-1", "F-3", "424B*", "4"],
                   max_requests_per_sec: 5, lookback_days: 3}   # needs SEC_USER_AGENT in .env
    alpaca_news:  {enabled: false}
    newsfilter:   {enabled: auto}     # auto = on only when NEWSFILTER_API_KEY is in .env

# --- Sentiment ---------------------------------------------------------------------
# Crowd buzz from social sources (only tickers on the Scout's radar) + market regime (plain Python).
sentiment:
  poll_interval_sec: 120             # each watched ticker at most once per poll (StockTwits: 1 call per ticker)
  watch_minutes: 90
  max_watch: 20
  trend_points: 10                   # buzz change on the 0-100 scale that counts as rising / fading
  trend_lookback_min: 10
  promo_share: 0.3                   # >= 30% of recent posts look like promotion -> promo warning for the Skeptic
  local_tone:                        # qwen tone scoring of recent posts (free, local)
    enabled: true
    thinking: false
  regime:
    symbols: [SPY, QQQ, IWM]
    vix_symbol: "^VIX"               # Yahoo symbol; Alpaca has no index data (best effort)
    sma_days: 20
    up_day_pct: 0.3
    down_day_pct: -0.5
    vix_calm: 18
    vix_fear: 25
    vix_spike_pct: 8
    supportive_at: 3
    hostile_at: -3
    refresh_sec: 120
  sources:
    stocktwits: {enabled: true, token_file: data/stocktwits_token.json}   # official MCP server; log in with
                                                                          # `python -m tradingdesk stocktwits-login`
    x:          {enabled: false}     # waiting on the X API cost decision
    reddit:     {enabled: false, subreddits: [wallstreetbets, pennystocks, Daytrading]}   # waiting on Reddit approval

alerts:
  discord_enabled: true
